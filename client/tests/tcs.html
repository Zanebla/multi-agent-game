<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Snake Game</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #0f0f0f;
      color: #00ff00;
      font-family: 'Courier New', Courier, monospace;
    }

    #gameCanvas {
      border: 5px solid #00ffff;
      background: linear-gradient(145deg, #1a1a1a, #333333);
      box-shadow: 0 0 10px #00ffff;
    }

    #mainMenu {
      display: none;
      text-align: center;
    }

    button {
      background-color: #333;
      color: #00ff00;
      border: none;
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
      font-size: 16px;
      box-shadow: 0 0 5px #00ff00;
    }

    button:hover {
      background-color: #00ff00;
      color: #333;
    }
  </style>
</head>

<body>
  <div id="mainMenu">
    <h1>Cyberpunk Snake Game</h1>
    <button onclick="startGame()">Start Game</button>
    <button onclick="showInstructions()">Game Instructions</button>
    <button onclick="exitGame()">Exit Game</button>
  </div>
  <canvas id="gameCanvas" width="600" height="400"></canvas>
  <script>
    const canvas = document.getElementById('gameCanvas')
    const ctx = canvas.getContext('2d')
    let snake = [{ x: 150, y: 150 }]
    let direction = { x: 10, y: 0 }
    let food = { x: 200, y: 200 }
    let score = 0
    let gameLoop

    document.addEventListener('keydown', changeDirection)

    function startGame () {
      document.getElementById('mainMenu').style.display = 'none'
      gameLoop = setInterval(update, 100)
    }

    function changeDirection (event) {
      const keyPressed = event.key
      const LEFT = 'ArrowLeft'
      const UP = 'ArrowUp'
      const RIGHT = 'ArrowRight'
      const DOWN = 'ArrowDown'

      switch (keyPressed) {
        case LEFT:
          if (direction.x === 0) {
            direction = { x: -10, y: 0 }
          }
          break
        case UP:
          if (direction.y === 0) {
            direction = { x: 0, y: -10 }
          }
          break
        case RIGHT:
          if (direction.x === 0) {
            direction = { x: 10, y: 0 }
          }
          break
        case DOWN:
          if (direction.y === 0) {
            direction = { x: 0, y: 10 }
          }
          break
      }
    }

    function update () {
      clearCanvas()
      moveSnake()
      drawSnake()
      drawFood()
      checkCollision()
    }

    function clearCanvas () {
      ctx.fillStyle = '#1a1a1a'
      ctx.fillRect(0, 0, canvas.width, canvas.height)
    }

    function moveSnake () {
      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y }
      snake.unshift(head)

      if (head.x === food.x && head.y === food.y) {
        score += 10
        generateFood()
      } else {
        snake.pop()
      }
    }

    function drawSnake () {
      ctx.fillStyle = '#00ff00'
      snake.forEach(part => {
        ctx.fillRect(part.x, part.y, 10, 10)
      })
    }

    function drawFood () {
      ctx.fillStyle = '#ff0000'
      ctx.fillRect(food.x, food.y, 10, 10)
    }

    function generateFood () {
      food.x = Math.floor(Math.random() * canvas.width / 10) * 10
      food.y = Math.floor(Math.random() * canvas.height / 10) * 10
      snake.forEach(part => {
        if (part.x === food.x && part.y === food.y) generateFood()
      })
    }

    function checkCollision () {
      const head = snake[0]
      if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
        endGame()
      }

      for (let i = 1; i < snake.length; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) {
          endGame()
        }
      }
    }

    function endGame () {
      clearInterval(gameLoop)
      alert(`Game Over! Your Score: ${score}`)
      document.getElementById('mainMenu').style.display = 'block'
      snake = [{ x: 150, y: 150 }]
      direction = { x: 10, y: 0 }
      score = 0
      generateFood()
    }

    function showInstructions () {
      alert("Use the arrow keys to move the snake. Try to eat the food without hitting the walls or yourself!")
    }

    function exitGame () {
      window.close()
    }

    generateFood();
  </script>
</body>

</html>
